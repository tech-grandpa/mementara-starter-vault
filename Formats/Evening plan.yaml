project: Pocket observatory
session: Twilight notebook walk
purpose: Notice one detail and turn it into a useful note
pack:
  - Notebook and pencil
  - A warm layer
  - Downloaded field journal
steps:
  - Choose one question before leaving
  - Write an observation in your own words
  - Add a sketch if the shape matters
  - Review the note tomorrow
follow_up: Link the observation to a reading note
